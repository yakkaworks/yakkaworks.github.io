<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Blogs - Yakka Works</title>
  <meta name="description" content="Announcements, news, and updates from Yakka Works." />

  <link rel="icon" href="/assets/img/icon.ico" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/forum-list.css">
</head>
<body>

  <div id="navbar"></div>

  <main class="p-1 p-lg-3 my-3">

    <header class="yw-page-header mb-1 mb-lg-3">
      <h1 class="yw-page-title">Blogs</h1>
      <p class="yw-page-lede">Announcements, news, and updates from Yakka Works.</p>
    </header>

    <div class="yw-store-controls mb-1 mb-lg-3">
      <div class="row g-1 g-lg-3">
        <div class="col-12 col-md-4">
          <label for="library-category" class="form-label small">Category</label>
          <select id="library-category" class="form-select">
            <option value="">All categories</option>
          </select>
        </div>
        <div class="col-12 col-md-8">
          <label for="library-search" class="form-label small">Search</label>
          <input type="search" id="library-search" class="form-control" placeholder="Search blog posts">
        </div>
      </div>
    </div>

    <div id="library-status" class="yw-store-status" role="status" aria-live="polite"></div>

    <div id="library-content"></div>

  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/library.js"></script>
  <script src="/assets/js/blogs.js"></script>

</body>
    </html>
