<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Yakka Works</title>
  <meta name="description" content="This page could not be found.">
  <link rel="icon" href="assets/img/icon.ico">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <div id="yk-navbar"></div>

  <main class="flex-grow-1 d-flex align-items-center justify-content-center text-center py-5">
    <div class="container">
      <i class="bi bi-signpost-2 fs-1 text-primary d-block mb-3" aria-hidden="true"></i>
      <h1 class="h3 mb-2">No page found</h1>
      <p class="text-secondary mb-4">
        Redirecting you to the homepage in <span id="yk-redirect-count">5</span> seconds…
      </p>
      <a href="index.html" id="yk-redirect-link" class="btn btn-primary">
        <i class="bi bi-house-door me-2"></i>Go home now
      </a>
    </div>
  </main>

  <div id="yk-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/path-utils.js"></script>
  <script src="assets/js/components.js"></script>
  <script>
    (function () {
      var seconds = 5;
      var countEl = document.getElementById('yk-redirect-count');
      var homeUrl = window.YakkaPaths ? window.YakkaPaths.page('index.html') : 'index.html';

      document.getElementById('yk-redirect-link').setAttribute('href', homeUrl);

      var interval = setInterval(function () {
        seconds -= 1;
        if (countEl) countEl.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(interval);
          window.location.href = homeUrl;
        }
      }, 1000);
    })();
  </script>
</body>
        </html>
