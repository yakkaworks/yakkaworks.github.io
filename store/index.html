<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store — Yakka Works</title>
  <meta name="description" content="Explore Yakka Works' free TheoTown and Kustom content, plus commission info.">
  <link rel="icon" href="../assets/img/icon.ico">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <div id="yk-navbar"></div>

  <main class="flex-grow-1">

    <section class="py-4 border-bottom">
      <div class="container">
        <h1 class="h3 mb-1">Store</h1>
        <p class="text-secondary-emphasis mb-0">
          Explore our free and accessible TheoTown and Kustom content, as well as custom commission information.
        </p>
      </div>
    </section>

    <section class="py-4 border-bottom yk-store-filters">
      <div class="container">
        <form id="store-search-form" class="row g-2 align-items-end" role="search">

          <div class="col-12 col-md-5">
            <label for="store-search-input" class="form-label small mb-1">Search</label>
            <div class="input-group">
              <input type="search" id="store-search-input" class="form-control"
                     placeholder="Search title, description…" aria-label="Search store content">
              <button type="submit" class="btn btn-primary" aria-label="Submit search">
                <i class="bi bi-search" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="col-6 col-md-3">
            <label for="store-domain-select" class="form-label small mb-1">Domain</label>
            <select id="store-domain-select" class="form-select" aria-label="Filter by domain">
              <!-- populated by store.js -->
            </select>
          </div>

          <div class="col-6 col-md-3">
            <label for="store-category-select" class="form-label small mb-1">Category</label>
            <select id="store-category-select" class="form-select" aria-label="Filter by category">
              <!-- populated by store.js -->
            </select>
          </div>

        </form>
      </div>
    </section>

    <section class="py-4">
      <div class="container">
        <p id="store-status" class="text-secondary small mb-3" role="status" aria-live="polite"></p>
        <div id="store-grid" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4">
          <!-- cards rendered by store.js -->
        </div>
      </div>
    </section>

  </main>

  <div id="yk-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/path-utils.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/store.js"></script>
</body>
        </html>
