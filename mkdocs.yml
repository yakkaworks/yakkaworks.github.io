site_name: Yakka Works
site_description: Independent digital studio from Banyuwangi, Indonesia.
site_author: Yakka Works
site_url: https://yakkaworks.github.io/
use_directory_urls: true
docs_dir: docs
site_dir: site

# Legal and diagnostic pages are intentionally excluded from navigation.
not_in_nav: |
  /about*.md
  /terms*.md
  /privacy*.md
  /cookie*.md
  /license*.md
  /source*.md
  /debug*.md

hooks:
  - hooks/year.py
  - hooks/plugin_order.py
  - hooks/meta_description.py

theme:
  name: material
  custom_dir: overrides
  language: id
  font: false
  logo: assets/logo/logo.svg
  favicon: assets/logo/logo.ico
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.tooltips
    - content.footnote.tooltips
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Ikuti tema sistem
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Ganti ke mode gelap
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Ganti ke mode otomatis

markdown_extensions:
  - footnotes
  - admonition
  - abbr
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"
      separator: "_"
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: false
      languages:
        - locale: id
          default: true
          name: Bahasa Indonesia
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Beranda: Home
            Toko: Store
            Pustaka: Library
            Alat: Tools
            Blog: Blog
  - awesome-pages
  - blog:
      blog_dir: blogs
      post_dir: "{blog}/posts"
      post_url_format: "{date}/{slug}"
      post_url_date_format: yyyy/MM/dd
      post_date_format: long
      archive: true
      categories: true
      pagination_per_page: 10
  - redirects:
      redirect_maps: {}

extra_css:
  - assets/css/y2k.css

extra_javascript:
  - assets/js/y2k-clock.js
  - assets/js/blog-layout-cleanup.js

